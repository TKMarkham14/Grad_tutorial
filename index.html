	 <div id="map"></div>
		 
		
        <script type="text/javascript">


          var map = L.map('map', {
              center: [41.84, -87.68],
              zoom: 12
          });

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
               maxZoom: 16,
               minZoom: 3
            }).addTo(map);
			
		var maxVisitor = 653728
		
		L.geoJson(data,{
            pointToLayer(feature,latlng){
			var branch = Number(feature.properties.ytd)
			var scaler = Math.sqrt(branch/maxVisitor)*100
			console.log(branch)
			console.log(scaler)
			console.log(maxVisitor)
			
			const librarySvg = L.icon({ //Creating an icon
			iconUrl: 'librarysvg.svg', //Marker icons in Leaflet are defined by Icon objects, which are passed as an option when creating markers. Let’s create our icon:

			iconSize:    [scaler, scaler], // size of the icon using the branch size and largest branch size to create the variable "scaler'
			iconAnchor:   [scaler/2, scaler/2] });
            return L.marker(latlng, {icon: librarySvg})  //Now putting a marker with this icon on a map is easy:
	}
								
        }).addTo(map);
